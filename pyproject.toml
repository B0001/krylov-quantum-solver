[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_quantum_solver"
version = "0.1.0"
description = "Hybrid quantum-classical pipeline for molecular ground-state energies via real-time quantum Krylov subspace diagonalization, validated against FCI/CASCI and DMRG."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22.0",
    # scipy 1.16-1.17 crash the qiskit-nature import chain (vendored array_api_compat torch
    # detection bug); 1.15.x is the verified-working range. See requirements.txt.
    "scipy>=1.8.0,<1.16",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
    "qiskit>=1.0",
    "qiskit-nature>=0.7",
    "qiskit-aer>=0.13",
    "qiskit-ibm-runtime>=0.20",
    "pyscf>=2.0.0",
    "ase>=3.22",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.0.0",
]
# Optional classical reference for active spaces beyond exact FCI's reach (benchmark_dmrg.py,
# hybrid_quantum_solver.dmrg_reference). The code degrades to exact FCI when absent.
dmrg = [
    "block2>=0.5.3",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_quantum_solver*"]