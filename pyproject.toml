[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_quantum_solver"
version = "0.1.0"
description = "Hybrid quantum-classical pipeline for molecular ground-state energies via real-time quantum Krylov subspace diagonalization, validated against FCI/CASCI and DMRG."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22.0",
    # scipy 1.16-1.17 crash the qiskit-nature import chain (vendored array_api_compat torch
    # detection bug); 1.15.x is the verified-working range. See requirements.txt.
    "scipy>=1.8.0,<1.16",
    "polars>=1.0",
    "matplotlib>=3.10.9",
    "qiskit>=1.0",
    "qiskit-nature>=0.7",
    "qiskit-aer>=0.13",
    "qiskit-ibm-runtime>=0.20",
    "qiskit-addon-sqd>=0.12",
    "pyscf>=2.0.0",
    "ase>=3.22",
    # ChemCheck submission/scorecard schema validation (draft 2020-12; pulls in `referencing`).
    "jsonschema>=4.18",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.0.0",
]
# Optional classical reference for active spaces beyond exact FCI's reach (benchmark_dmrg.py,
# hybrid_quantum_solver.dmrg_reference). The code degrades to exact FCI when absent.
dmrg = [
    "block2>=0.5.3",
]
test = [
    "pytest>=7.0.0",
]
dev = [
    "ruff>=0.5",
]

[project.entry-points.pytest11]
# Auto-discovers the plugin once installed, so `pytest` loads it without an explicit -p flag.
# Entry-point name == module name so that an explicit `-p pytest_invariants` is deduped by
# pytest instead of registering the same module object under a second name (pluggy rejects that).
pytest_invariants = "pytest_invariants"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "hybrid_quantum_solver*", "certchem*", "chemcheck*", "shallowforge*", "senseforge*",
    "pytest_invariants*",
]

[tool.pytest.ini_options]
# Anchors pytest's rootdir at this directory. Without this section, pyproject.toml here doesn't
# qualify as a pytest config file, so pytest's rootdir search walks UP past this repo into its
# parent directory looking for one -- and if a sibling, unrelated project up there has its own
# pyproject.toml + conftest.py (as found while probing SPEC_nb_validate_sweep_schema.md: a "gene"
# bioinformatics project one level up force-stubs sys.modules["polars"] globally in its
# conftest.py, for its own test isolation), pytest silently loads that conftest.py too and every
# test in THIS repo gets the sibling's fake `polars` instead of the real package. testpaths below
# also narrows collection to tests/, matching this repo's actual layout.
testpaths = ["tests"]

[tool.ruff]
# orchestrate_hybrid_pipeline.py is a quarantined "what-not-to-do" regression fixture (see
# REFACTOR_PLAN.md); it is frozen and intentionally not reformatted.
extend-exclude = ["hybrid_quantum_solver/orchestrate_hybrid_pipeline.py"]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E402"]   # Sphinx: imports follow sys.path setup, by convention
"qubitization_blueprint.py" = ["E741"]  # `l` matches the math (SELECT = sum_l |l><l| ⊗ P_l)
