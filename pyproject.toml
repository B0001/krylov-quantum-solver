[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_quantum_solver"
version = "0.1.0"
description = "Enterprise-scale Sample-Based Krylov Quantum Diagonalization suite for strongly correlated molecular chemistry simulation."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=3.0.3",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.0.0", 
]
chemistry = [
    "pyscf>=2.0.0",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_quantum_solver*"]