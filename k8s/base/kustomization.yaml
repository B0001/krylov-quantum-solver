apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - pvc.yaml
  - job-benchmark-krylov.yaml
  - cronjob-cross-check.yaml

labels:
  - pairs:
      app.kubernetes.io/name: chem
      app.kubernetes.io/part-of: hybrid-quantum-solver
    # Never true for a Job/CronJob: the controller owns an immutable
    # batch.kubernetes.io/controller-uid selector.
    includeSelectors: false

images:
  - name: chem
    newTag: 0.1.0
