apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chem-dev
nameSuffix: -dev

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: dev
    includeSelectors: false

patches:
  - path: job-patch.yaml
    target:
      kind: Job
  - path: cronjob-patch.yaml
    target:
      kind: CronJob

configMapGenerator:
  - name: chem-env
    behavior: merge
    literals:
      # Kept in lockstep with the cpu limit set in job-patch.yaml. This pairing
      # is the whole reason the thread counts live in a ConfigMap.
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1

images:
  - name: chem
    newTag: dev
